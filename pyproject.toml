[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viralclip"
version = "0.4.1"
description = "Editor de Clips Virales: analiza transcripciones y genera clips con ganchos, subtítulos y hashtags."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Equipo Editor de Clips Virales" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "playwright>=1.45",
  "axe-playwright-python>=0.1.5",
]
build = [
  "pyinstaller>=6.0",
  "pillow>=10",
]

[project.scripts]
viralclip = "viralclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viralclip = ["py.typed", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["viralclip"]
branch = true
